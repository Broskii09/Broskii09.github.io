<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Food photo placeholder</title>
  <desc id="desc">Dark placeholder for Ray Leo's food photography.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#171717"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer></filter>
  </defs>
  <rect width="1200" height="820" fill="url(#g)"/>
  <rect width="1200" height="820" filter="url(#grain)" opacity=".35"/>
  <circle cx="895" cy="300" r="210" fill="#009B9B" opacity=".13"/>
  <circle cx="340" cy="520" r="260" fill="#D72819" opacity=".16"/>
  <path d="M128 632c186-86 378-121 562-104 122 11 245 48 382 111" fill="none" stroke="#F6B51D" stroke-width="10" opacity=".72"/>
  <rect x="132" y="118" width="330" height="86" rx="8" fill="#D72819" opacity=".9"/>
  <text x="162" y="173" fill="#FFF8EA" font-family="Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="2">FOOD PHOTO</text>
  <text x="132" y="740" fill="#FFF8EA" font-family="Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-2">DROP REAL IMAGE HERE</text>
</svg>
